# Local dependency software ONLY.
# Application processes run on the host (not in Docker):
#   - Stream:  npm run local:stream   (local/stream_app.py :8787)
#   - Web UI:  npm run local:web      (Vite :5173)
#
# V1 local mode talks to Bedrock + public APIs (PubMed / CT.gov / ChEMBL) —
# no Redis/Postgres is required yet. Add infra services below when needed.
#
#   npm run local:deps:start
#   npm run local:up          # host stream
#   npm run local:web         # host UI

name: agentic-target-id-local-deps

services: {}

